<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review card — JWP Electric</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .card { max-width: 480px; margin: 1.4rem auto; background: #fff; border: 6px solid #121417; padding: 1.3rem; }
    .card img { width: 220px; height: 220px; display: block; margin: 0.7rem auto; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .actions button, .actions a { background: #9b1c1c; color: #fff; border: 0; padding: 0.5rem 0.7rem; text-decoration: none; font-weight: 700; cursor: pointer; font-family: "Barlow Condensed", sans-serif; letter-spacing: .06em; text-transform: uppercase; }
    @media print { .top, .actions, .lang { display: none !important; } body { background: #fff; } }
  </style>
</head>
<body>
  <header class="top">
    <span>JWP Electric · #951604</span>
    <nav class="lang" aria-label="Language">
      <button type="button" data-set="en" aria-pressed="true">EN</button>
      <button type="button" data-set="es" aria-pressed="false">ES</button>
    </nav>
  </header>
  <article class="card">
    <h1 class="lettering" style="font-size:2rem;margin:0;">JWP Electric</h1>
    <p data-en="Licensed Electrical Contractor #951604 · Cell (858) 431-9669" data-es="Contratista eléctrico con licencia #951604 · Celular (858) 431-9669">Licensed Electrical Contractor #951604 · Cell (858) 431-9669</p>
    <p><a class="plain" href="tel:+18584319669">(858) 431-9669</a> · <a class="plain" href="mailto:info@jwpelectric.com">info@jwpelectric.com</a></p>
    <img src="review-qr.svg" width="220" height="220" alt="QR code to find JWP Electric on Google">
    <p data-en="Scan to find us on Google and leave a review." data-es="Escanee para encontrarnos en Google y dejar una reseña.">Scan to find us on Google and leave a review.</p>
    <div class="actions">
      <button type="button" id="print-card" data-en="Print this card" data-es="Imprimir esta tarjeta">Print this card</button>
      <a href="index.html" data-en="Back to the van" data-es="Volver a la camioneta">Back to the van</a>
    </div>
  </article>
  <script src="script.js"></script>
</body>
</html>
